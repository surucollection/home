<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Suru Collection Admin</title><link rel="stylesheet" href="admin.css"></head><body>
<div id="loginView" class="login-wrap"><form id="loginForm" class="login-card">
<h1>Suru Collection</h1><p>Admin Panel</p>
<input id="loginEmail" type="email" placeholder="Email" required>
<input id="loginPassword" type="password" placeholder="Password" required>
<button class="primary">Sign In</button><div id="loginMessage" class="message"></div>
</form></div>
<div id="appView" class="app hidden">
<aside class="sidebar"><div class="brand">Suru Collection</div>
<button class="active" data-view="dashboard">Dashboard</button><button data-view="orders">Orders</button>
<button data-view="products">Products</button><button data-view="inventory">Inventory</button><button data-view="subscribers">Subscribers</button>
<button id="logoutBtn" class="logout">Logout</button></aside>
<main class="main"><header class="top"><div><h1 id="viewTitle">Dashboard</h1><span id="userEmail"></span></div></header>
<section id="dashboard" class="view active"><div class="stats"><div><b id="statOrders">0</b><span>Orders</span></div><div><b id="statProducts">0</b><span>Active Products</span></div><div><b id="statSubscribers">0</b><span>Subscribers</span></div><div><b id="statPending">0</b><span>Pending</span></div></div><div class="card"><h2>Recent Orders</h2><div id="recentOrders"></div></div></section>
<section id="orders" class="view"><div class="toolbar"><input id="orderSearch" placeholder="Search order, customer or phone"><select id="orderStatusFilter"><option value="">All statuses</option><option>pending</option><option>confirmed</option><option>processing</option><option>shipped</option><option>delivered</option><option>cancelled</option></select></div><div class="card"><div id="ordersTable"></div></div></section>
<section id="products" class="view"><div class="toolbar"><button id="newProductBtn" class="primary">＋ Add New Product</button></div><div id="productFormWrap" class="card hidden"></div><div id="productsGrid"></div></section>
<section id="inventory" class="view"><div id="inventoryGrid"></div></section>
<section id="subscribers" class="view"><div class="card"><h2>Newsletter Subscribers</h2><div id="subscriberCount"></div><div id="subscribersTable"></div></div></section>
</main></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../supabase-config.js"></script><script src="admin.js"></script>
</body></html>
