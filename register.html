<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create Account | Suru Collection</title><link rel="stylesheet" href="customer.css"></head><body><main class="page"><section class="auth-card"><img src="assets/suru-logo-official.png" alt="Suru Collection"><h1>Create Account</h1><form id="registerForm"><label class="field">Full Name<input id="name" required></label><label class="field">Phone Number<input id="phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="98XXXXXXXX" required></label><label class="field">Password<input id="password" type="password" minlength="6" autocomplete="new-password" required></label><label class="field">Confirm Password<input id="confirmPassword" type="password" minlength="6" autocomplete="new-password" required></label><label class="field">Delivery Address<textarea id="address" rows="3" required></textarea></label><label class="field">City<input id="city" placeholder="Gaur" required></label><label class="field">District<input id="district" placeholder="Rautahat" required></label><button class="btn" type="submit">Create Account</button><div id="message" class="message"></div></form><div class="auth-links">Already have an account? <a href="login.html">Sign in</a></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="customer-auth.js"></script></body></html>
