<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Suru Collection Admin</title><link rel="stylesheet" href="admin.css"></head><body><main class="wrap"><header><div><p class="eyebrow">SURU COLLECTION</p><h1>Admin Dashboard</h1><p id="status">Sign in to manage orders.</p></div><button id="logout" hidden>Log out</button></header><section id="loginCard" class="card"><h2>Admin Login</h2><label>Email<input id="email" type="email" autocomplete="username"></label><label>Password<input id="password" type="password" autocomplete="current-password"></label><button id="login">Sign in</button><p id="loginMsg"></p></section><section id="dashboard" hidden><div class="toolbar"><button data-filter="all" class="filter active">All</button><button data-filter="pending" class="filter">Pending</button><button data-filter="confirmed" class="filter">Confirmed</button><button data-filter="processing" class="filter">Processing</button><button data-filter="shipped" class="filter">Shipped</button><button data-filter="delivered" class="filter">Delivered</button><button data-filter="cancelled" class="filter">Cancelled</button></div><div id="orders" class="orders"></div></section></main><script src="../supabase-config.js"></script><script type="module">
const {createClient}=await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm');const supabase=createClient(window.SURU_SUPABASE_URL,window.SURU_SUPABASE_PUBLISHABLE_KEY);let allOrders=[],filter='all';const $=id=>document.getElementById(id);function money(n){return 'NPR '+Number(n||0).toLocaleString('en-IN')}async function load(){const {data,error}=await supabase.from('orders').select('*,order_items(*)').order('created_at',{ascending:false});if(error){$('status').textContent=error.message;return}allOrders=data||[];render()}function render(){const rows=filter==='all'?allOrders:allOrders.filter(o=>o.order_status===filter);$('orders').innerHTML=rows.length?rows.map(o=>`<article class="order card"><div class="order-head"><div><h2>${o.order_number}</h2><p>${new Date(o.created_at).toLocaleString()}</p></div><select class="status" data-id="${o.id}">${['pending','confirmed','processing','packed','shipped','delivered','cancelled','returned'].map(s=>`<option value="${s}" ${s===o.order_status?'selected':''}>${s}</option>`).join('')}</select></div><div class="customer"><strong>${o.customer_name}</strong><span>${o.customer_phone}</span><span>${o.shipping_address}, ${o.city||''}${o.district?', '+o.district:''}</span><span>Payment: ${o.payment_method} / ${o.payment_status}</span></div><ul>${(o.order_items||[]).map(i=>`<li>${i.product_code} — ${i.product_name}${i.size?' | '+i.size:''} × ${i.quantity} <b>${money(i.total_price)}</b></li>`).join('')}</ul><div class="total">Total <strong>${money(o.total)}</strong></div>${o.customer_note?`<p class="note">Note: ${o.customer_note}</p>`:''}</article>`).join(''):'<div class="card"><p>No orders found.</p></div>'}
$('login').onclick=async()=>{const {error}=await supabase.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});$('loginMsg').textContent=error?error.message:'Signed in.';if(!error)await init()};$('logout').onclick=async()=>{await supabase.auth.signOut();location.reload()};document.querySelectorAll('.filter').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;document.querySelectorAll('.filter').forEach(x=>x.classList.remove('active'));b.classList.add('active');render()});document.addEventListener('change',async e=>{if(!e.target.matches('.status'))return;const {error}=await supabase.from('orders').update({order_status:e.target.value}).eq('id',e.target.dataset.id);if(error)alert(error.message);else await load()});async function init(){const {data:{user}}=await supabase.auth.getUser();if(!user)return;$('loginCard').hidden=true;$('dashboard').hidden=false;$('logout').hidden=false;$('status').textContent='Signed in as '+(user.email||'admin');await load()}await init();
</script></body></html>
