name: Suru Collection iOS IPA

on:
  push:
    branches:
      - feat/native-mobile-app
    paths:
      - 'mobile/**'
      - '.github/workflows/ios-unsigned.yml'
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        working-directory: mobile
        run: npm ci

      - name: Generate app icons without changing the original logo layout
        working-directory: mobile
        shell: bash
        run: |
          python3 -m venv /tmp/suru-icons-venv
          /tmp/suru-icons-venv/bin/python -m pip install --disable-pip-version-check Pillow
          /tmp/suru-icons-venv/bin/python
          curl -fsSL "https://raw.githubusercontent.com/surucollection/home/d0f50f6e4e92f6eabd917ff04b0581d035f9fbe9/assets/suru-logo-official.png" -o /tmp/suru-logo-official.png
          python3 -m venv /tmp/suru-icons-venv
          /tmp/suru-icons-venv/bin/python -m pip install --disable-pip-version-check Pillow
          /tmp/suru-icons-venv/bin/python - <<'PY'
          from PIL import Image
          from pathlib import Path

          # Keep the official source image's full canvas and original artwork placement.
          # Do not crop to the logo bounds or enlarge the logo inside the square.
          source = Image.open("/tmp/suru-logo-official.png").convert("RGBA")
          source.thumbnail((512, 512), Image.Resampling.LANCZOS)
          canvas = Image.new("RGBA", (512, 512), (0, 0, 0, 0))
          canvas.alpha_composite(source, ((512 - source.width) // 2, (512 - source.height) // 2))

          assets = Path("assets")
          assets.mkdir(exist_ok=True)
          canvas.save(assets / "icon.png", "PNG", optimize=True)
          canvas.save(assets / "adaptive-icon.png", "PNG", optimize=True)
          canvas.save(assets / "play-store-icon-512.png", "PNG", optimize=True)

          # iOS app icons must be opaque; retain the same logo size and position on white.
          ios = Image.new("RGBA", (512, 512), (255, 255, 255, 255))
          ios.alpha_composite(canvas)
          ios.convert("RGB").save(assets / "ios-icon.png", "PNG", optimize=True)

          for name in ("icon.png", "adaptive-icon.png", "play-store-icon-512.png", "ios-icon.png"):
              image = Image.open(assets / name)
              image.load()
              assert image.size == (512, 512), (name, image.size)
          assert Image.open(assets / "icon.png").mode == "RGBA"
          assert Image.open(assets / "adaptive-icon.png").mode == "RGBA"
          assert Image.open(assets / "play-store-icon-512.png").mode == "RGBA"
          assert Image.open(assets / "ios-icon.png").mode == "RGB"
          print("Generated 512x512 icons preserving original logo framing.")
      - name: Generate iOS project
        working-directory: mobile
        run: npx expo prebuild --platform ios --no-install

      - name: Install CocoaPods
        working-directory: mobile
        run: pod install --project-directory=ios

      - name: Build unsigned iOS app
        run: |
          xcodebuild \
            -workspace mobile/ios/SuruNepalFashionStore.xcworkspace \
            -scheme SuruNepalFashionStore \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          mkdir -p ipa/Payload
          cp -R build/Build/Products/Release-iphoneos/SuruNepalFashionStore.app ipa/Payload/
          cd ipa
          zip -qr ../SuruCollection-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Suru-Collection-Unsigned-iOS
          path: SuruCollection-unsigned.ipa
          retention-days: 7
