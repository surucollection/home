name: Deploy Suru Collection
# Live deployment trigger: 2026-10-08-fonepay-qr-fix

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Optimize SC063 main product image for mobile and web
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/optimized-products
          curl -fsSL "https://images.suru.com.np/products/SC063_1.png" -o /tmp/SC063_1.png
          python3 -m venv /tmp/suru-image-venv
          /tmp/suru-image-venv/bin/python -m pip install --disable-pip-version-check Pillow
          /tmp/suru-image-venv/bin/python - <<'PY'
          from pathlib import Path
          from PIL import Image

          source_path = Path("/tmp/SC063_1.png")
          output_path = Path("assets/optimized-products/SC063_1.webp")
          with Image.open(source_path) as source:
              source.load()
              original_dimensions = source.size
              source.thumbnail((1600, 2000), Image.Resampling.LANCZOS)
              optimized = source.convert("RGB")
              optimized.save(output_path, "WEBP", quality=84, method=6)
          original_size = source_path.stat().st_size
          optimized_size = output_path.stat().st_size
          if optimized_size <= 0 or optimized_size >= original_size:
              raise SystemExit(
                  f"SC063 image optimization did not reduce the file: {original_size} -> {optimized_size} bytes"
              )
          print(f"SC063 source: {original_dimensions[0]}x{original_dimensions[1]}, {original_size:,} bytes")
          print(f"SC063 WebP: {optimized_size:,} bytes ({optimized_size / original_size:.1%} of source)")
          PY

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build
      - name: Verify generated R2 product share page
        shell: bash
        run: |
          set -euo pipefail
          SHARE_PAGE="dist/share/SC065/index.html"
          test -s "$SHARE_PAGE"
          grep -q 'property="og:image"' "$SHARE_PAGE"
          grep -q 'https://images.suru.com.np/products/SC065_1.jpg' "$SHARE_PAGE"
          grep -q 'https://suru.com.np/product.html?code=SC065' "$SHARE_PAGE"
          grep -q 'suru://product?code=SC065' "$SHARE_PAGE"
          grep -q 'intent://product?code=SC065' "$SHARE_PAGE"
          test -s "dist/.well-known/assetlinks.json"
          grep -q "np.com.suru.collection" "dist/.well-known/assetlinks.json"
          test -s "dist/assets/optimized-products/SC063_1.webp"
          grep -q "https://suru.com.np/assets/optimized-products/SC063_1.webp" "dist/share/SC063/index.html"
          test -s "dist/wishlist/index.html"
          test -s "dist/account/index.html"
          LEGACY_URL="https://vkycraymxhkqxgpcpdzw.supabase.co/functions/v1/product-share?code=SC065"
          curl -sS -D /tmp/suru-legacy-share-headers.txt -o /dev/null "$LEGACY_URL"
          grep -Eq '^HTTP/[^ ]+ 302' /tmp/suru-legacy-share-headers.txt
          grep -qi '^location: https://suru.com.np/share/SC065/' /tmp/suru-legacy-share-headers.txt
          echo "Static preview page and legacy share-link redirect both verified."

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify live Android association and optimized SC063 image
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 5 --retry-delay 2 "https://suru.com.np/.well-known/assetlinks.json" -o /tmp/assetlinks.json
          grep -q "np.com.suru.collection" /tmp/assetlinks.json
          grep -q "FA: C6: 17: 45: DC: 09: 03: 78: 6F: B9: ED: E6: 2A: 96: 2B: 39: 9F: 73: 48: F0: BB: 6F: 89: 9B: 83: 32: 66: 75: 91: 03: 3B: 9C" /tmp/assetlinks.json
          curl -fsSL --retry 5 --retry-delay 2 "https://suru.com.np/assets/optimized-products/SC063_1.webp" -o /tmp/SC063_live.webp
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          image_path = Path("/tmp/SC063_live.webp")
          with Image.open(image_path) as image:
              image.verify()
          size = image_path.stat().st_size
          if size <= 0 or size > 300_000:
              raise SystemExit(f"Unexpected deployed SC063 WebP size: {size} bytes")
          print(f"Live SC063 WebP verified: {size:,} bytes")
          PY
          curl -fsSL --retry 5 --retry-delay 2 "https://suru.com.np/share/SC063/" -o /tmp/SC063_share.html
          grep -q "https://suru.com.np/assets/optimized-products/SC063_1.webp" /tmp/SC063_share.html
          echo "Live app association, optimized product image, and share preview verified."
