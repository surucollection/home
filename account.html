<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Account | Suru Collection</title><link rel="stylesheet" href="customer.css"></head><body><header class="customer-header"><a href="index.html"><img src="assets/suru-logo-official.png" alt="Suru Collection"></a><nav><a href="index.html">Shop</a><button id="logoutBtn" class="btn secondary" type="button">Logout</button></nav></header><main class="page"><section class="account-card"><h1>Welcome, <span id="customerName">Customer</span></h1><h2>My Profile</h2><div class="profile-grid"><div><b>Name</b><span id="profileName">—</span></div><div><b>Phone</b><span id="profilePhone">—</span></div><div><b>Address</b><span id="profileAddress">—</span></div><div><b>City / District</b><span id="profileCity">—</span></div></div><h2>My Orders</h2><div id="orders">Loading orders…</div><h2>Change Password</h2><form id="changePasswordForm"><label class="field">New Password<input id="newPassword" type="password" minlength="6" autocomplete="new-password" required></label><label class="field">Confirm New Password<input id="confirmNewPassword" type="password" minlength="6" autocomplete="new-password" required></label><button class="btn" type="submit">Change Password</button></form><div id="message" class="message"></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="customer-auth.js"></script></body></html>
