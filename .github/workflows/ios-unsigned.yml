name: Suru Collection iOS IPA

on:
  push:
    branches:
      - feat/native-mobile-app
    paths:
      - 'mobile/**'
      - '.github/workflows/ios-unsigned.yml'
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        working-directory: mobile
        run: npm ci

      - name: Generate compatible Suru app icons from official logo
        working-directory: mobile
        shell: bash
        run: |
          python3 -m venv /tmp/suru-icons-venv
          /tmp/suru-icons-venv/bin/python -m pip install --disable-pip-version-check Pillow
          /tmp/suru-icons-venv/bin/python - <<'PY'
          from PIL import Image
          from pathlib import Path

          source = Image.open("assets/suru-logo-transparent.png").convert("RGBA")
          bbox = source.getchannel("A").getbbox()
          if bbox:
              source = source.crop(bbox)

          assets = Path("assets")
          assets.mkdir(exist_ok=True)

          def contain(canvas_size, max_size, background):
              logo = source.copy()
              logo.thumbnail((max_size, max_size), Image.Resampling.LANCZOS)
              canvas = Image.new("RGBA", (canvas_size, canvas_size), background)
              canvas.alpha_composite(logo, ((canvas_size - logo.width) // 2, (canvas_size - logo.height) // 2))
              return canvas

          transparent = (0, 0, 0, 0)
          white = (255, 255, 255, 255)
          # Main app artwork and Android adaptive foreground keep true transparency.
          contain(512, 460, transparent).save(assets / "icon.png", "PNG", optimize=True)
          contain(512, 400, transparent).save(assets / "adaptive-icon.png", "PNG", optimize=True)
          # iOS and Play listing artwork use a solid white canvas for platform compatibility.
          contain(512, 460, white).convert("RGB").save(assets / "ios-icon.png", "PNG", optimize=True)
          contain(512, 460, white).convert("RGB").save(assets / "play-store-icon-512.png", "PNG", optimize=True)
          for name in ("icon.png", "adaptive-icon.png", "ios-icon.png", "play-store-icon-512.png"):
              image = Image.open(assets / name)
              image.load()
              assert image.size == (512, 512), (name, image.size)
          assert Image.open(assets / "icon.png").mode == "RGBA"
          assert Image.open(assets / "adaptive-icon.png").mode == "RGBA"
          assert Image.open(assets / "ios-icon.png").mode == "RGB"
          assert Image.open(assets / "play-store-icon-512.png").mode == "RGB"
          print("Generated verified 512x512 Suru icons.")
          PY

      - name: Generate iOS project
        working-directory: mobile
        run: npx expo prebuild --platform ios --no-install

      - name: Install CocoaPods
        working-directory: mobile
        run: pod install --project-directory=ios

      - name: Build unsigned iOS app
        run: |
          xcodebuild \
            -workspace mobile/ios/SuruCollection.xcworkspace \
            -scheme SuruCollection \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          mkdir -p ipa/Payload
          cp -R build/Build/Products/Release-iphoneos/SuruCollection.app ipa/Payload/
          cd ipa
          zip -qr ../SuruCollection-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Suru-Collection-Unsigned-iOS
          path: SuruCollection-unsigned.ipa
          retention-days: 7
