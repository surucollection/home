name: Suru Collection iOS IPA

on:
  push:
    branches:
      - feat/native-mobile-app
    paths:
      - 'mobile/**'
      - '.github/workflows/ios-unsigned.yml'
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        working-directory: mobile
        run: npm ci

      - name: Generate compatible Suru app icons from official logo
        working-directory: mobile
        shell: bash
        run: |
          python3 -m pip install --disable-pip-version-check --user Pillow
          curl -fsSL "https://raw.githubusercontent.com/surucollection/home/d0f50f6e4e92f6eabd917ff04b0581d035f9fbe9/assets/suru-logo-official.png" -o /tmp/suru-logo-official.png
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path

          source = Image.open("/tmp/suru-logo-official.png").convert("RGBA")
          bbox = source.getchannel("A").getbbox()
          if bbox:
              source = source.crop(bbox)

          assets = Path("assets")
          assets.mkdir(exist_ok=True)

          def contain(canvas_size, max_size, background):
              logo = source.copy()
              logo.thumbnail((max_size, max_size), Image.Resampling.LANCZOS)
              canvas = Image.new("RGBA", (canvas_size, canvas_size), background)
              canvas.alpha_composite(logo, ((canvas_size - logo.width) // 2, (canvas_size - logo.height) // 2))
              return canvas

          launcher = contain(512, 480, (255, 255, 255, 255))
          launcher.convert("RGB").save(assets / "icon.png", "PNG", optimize=False)
          launcher.convert("RGB").save(assets / "play-store-icon-512.png", "PNG", optimize=False)
          contain(512, 400, (0, 0, 0, 0)).save(assets / "adaptive-icon.png", "PNG", optimize=False)

          for name in ("icon.png", "adaptive-icon.png", "play-store-icon-512.png"):
              image = Image.open(assets / name)
              image.load()
              assert image.size == (512, 512)
              assert image.mode in ("RGB", "RGBA")
          print("Generated verified 512x512 Suru icons.")
          PY

      - name: Generate iOS project
        working-directory: mobile
        run: npx expo prebuild --platform ios --no-install

      - name: Install CocoaPods
        working-directory: mobile
        run: pod install --project-directory=ios

      - name: Build unsigned iOS app
        run: |
          xcodebuild \
            -workspace mobile/ios/SuruCollection.xcworkspace \
            -scheme SuruCollection \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          mkdir -p ipa/Payload
          cp -R build/Build/Products/Release-iphoneos/SuruCollection.app ipa/Payload/
          cd ipa
          zip -qr ../SuruCollection-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Suru-Collection-Unsigned-iOS
          path: SuruCollection-unsigned.ipa
          retention-days: 7
