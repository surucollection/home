name: Suru Collection iOS IPA

on:
  push:
    branches:
      - feat/native-mobile-app
    paths:
      - 'mobile/**'
      - '.github/workflows/ios-unsigned.yml'
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        working-directory: mobile
        run: npm install --no-audit --no-fund

      - name: Generate app icons preserving original logo artwork
        working-directory: mobile
        shell: bash
        run: |
          python3 -m venv /tmp/suru-icons-venv
          /tmp/suru-icons-venv/bin/python -m pip install --disable-pip-version-check Pillow
          curl -fsSL "https://raw.githubusercontent.com/surucollection/home/d0f50f6e4e92f6eabd917ff04b0581d035f9fbe9/assets/suru-logo-official.png" -o /tmp/suru-logo-official.png
          /tmp/suru-icons-venv/bin/python - <<'PY'
          from PIL import Image
          from pathlib import Path

          # Keep the official image's full canvas and artwork placement; never crop or enlarge it.
          source = Image.open("/tmp/suru-logo-official.png").convert("RGBA")
          # If the source is an opaque image, remove only edge-connected near-white canvas pixels.
          # Enclosed white artwork details stay white; logo pixels are never recoloured.
          if source.getchannel("A").getextrema() == (255, 255):
              width, height = source.size
              pixels = source.load()
              seen = bytearray(width * height)
              stack = []
              def is_canvas_white(x, y):
                  r, g, b, _ = pixels[x, y]
                  return r >= 245 and g >= 245 and b >= 245
              def enqueue(x, y):
                  index = y * width + x
                  if not seen[index] and is_canvas_white(x, y):
                      seen[index] = 1
                      stack.append((x, y))
              for x in range(width):
                  enqueue(x, 0)
                  enqueue(x, height - 1)
              for y in range(height):
                  enqueue(0, y)
                  enqueue(width - 1, y)
              while stack:
                  x, y = stack.pop()
                  r, g, b, _ = pixels[x, y]
                  pixels[x, y] = (r, g, b, 0)
                  for ny in range(max(0, y - 1), min(height, y + 2)):
                      for nx in range(max(0, x - 1), min(width, x + 2)):
                          enqueue(nx, ny)
          
          # Resize the full source canvas proportionally. Never crop to the logo bounds.
          source.thumbnail((512, 512), Image.Resampling.LANCZOS)
          canvas = Image.new("RGBA", (512, 512), (0, 0, 0, 0))
          canvas.alpha_composite(source, ((512 - source.width) // 2, (512 - source.height) // 2))
          assets = Path("assets")
          assets.mkdir(exist_ok=True)
          canvas.save(assets / "icon.png", "PNG", optimize=True)
          canvas.save(assets / "adaptive-icon.png", "PNG", optimize=True)
          canvas.save(assets / "play-store-icon-512.png", "PNG", optimize=True)
          ios = Image.new("RGBA", (512, 512), (255, 255, 255, 255))
          ios.alpha_composite(canvas)
          ios.convert("RGB").save(assets / "ios-icon.png", "PNG", optimize=True)
          for name in ("icon.png", "adaptive-icon.png", "play-store-icon-512.png", "ios-icon.png"):
              image = Image.open(assets / name)
              image.load()
              assert image.size == (512, 512), (name, image.size)
          assert Image.open(assets / "icon.png").mode == "RGBA"
          assert Image.open(assets / "adaptive-icon.png").mode == "RGBA"
          assert Image.open(assets / "play-store-icon-512.png").mode == "RGBA"
          assert Image.open(assets / "ios-icon.png").mode == "RGB"
          print("Generated 512x512 icons preserving original logo framing.")
          PY
      - name: Generate iOS project
        working-directory: mobile
        run: npx expo prebuild --platform ios --no-install

      - name: Install CocoaPods
        working-directory: mobile
        run: pod install --project-directory=ios

      - name: Build unsigned iOS app
        run: |
          xcodebuild \
            -workspace mobile/ios/SuruNepalFashionStore.xcworkspace \
            -scheme SuruNepalFashionStore \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          mkdir -p ipa/Payload
          cp -R build/Build/Products/Release-iphoneos/SuruNepalFashionStore.app ipa/Payload/
          cd ipa
          zip -qr ../SuruCollection-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Suru-Collection-Unsigned-iOS
          path: SuruCollection-unsigned.ipa
          retention-days: 7
