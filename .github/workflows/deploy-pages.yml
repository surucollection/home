name: Deploy Suru Collection
# Live deployment trigger: 2026-10-08-fonepay-qr-fix

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build
      - name: Verify product share preview and browser redirect
        shell: bash
        run: |
          set -euo pipefail
          SHARE_URL="https://vkycraymxhkqxgpcpdzw.supabase.co/functions/v1/product-share?code=SC065&v=2"

          curl --retry 3 --retry-delay 2 -fsS \
            -A "facebookexternalhit/1.1 Facebot" \
            -H "Accept: text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8" \
            -D /tmp/suru-preview-headers.txt \
            -o /tmp/suru-preview.html \
            "$SHARE_URL"

          grep -qi '^content-type: text/html' /tmp/suru-preview-headers.txt
          grep -q 'property="og:image"' /tmp/suru-preview.html
          grep -q 'https://images.suru.com.np/products/SC065_1.jpg' /tmp/suru-preview.html

          curl -sS \
            -A "Mozilla/5.0 (iPhone; CPU iPhone OS 18_7 like Mac OS X) AppleWebKit/605.1.15 Version/27.2 Mobile/15E148 Safari/604.1" \
            -H "Accept: text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8" \
            -D /tmp/suru-click-headers.txt \
            -o /dev/null \
            "$SHARE_URL"

          grep -Eq '^HTTP/[^ ]+ 302' /tmp/suru-click-headers.txt
          grep -qi '^location: https://suru.com.np/product.html?code=SC065' /tmp/suru-click-headers.txt
          echo "Product share preview returns R2 Open Graph metadata and browser clicks redirect to the product page."

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
