name: Suru Collection Android APK

on:
  push:
    branches:
      - feat/native-mobile-app
    paths:
      - 'mobile/**'
      - '.github/workflows/android-debug-apk.yml'
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate Android SDK manager
        id: android-sdk
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager was not found under $SDK_ROOT/cmdline-tools"
            find "$SDK_ROOT" -maxdepth 4 -type f -name sdkmanager -print || true
            exit 1
          fi
          echo "sdkmanager=$SDKMANAGER" >> "$GITHUB_OUTPUT"
          echo "Using $SDKMANAGER"

      - name: Accept Android SDK licences and install required packages
        shell: bash
        run: |
          SDKMANAGER="${{ steps.android-sdk.outputs.sdkmanager }}"
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          set +o pipefail
          yes | "$SDKMANAGER" --licenses
          set -o pipefail
          "$SDKMANAGER" --install "platform-tools" "platforms;android-37.0" "build-tools;37.0.0"
          if [ -d "$SDK_ROOT/platforms/android-37.0" ] && [ ! -e "$SDK_ROOT/platforms/android-37" ]; then
            ln -s android-37.0 "$SDK_ROOT/platforms/android-37"
          fi
          ls -ld "$SDK_ROOT/platforms/android-37" "$SDK_ROOT/platforms/android-37.0"

      - name: Install dependencies
        working-directory: mobile
        run: npm ci

      - name: Remove Expo development launcher for standalone Android app
        working-directory: mobile
        shell: bash
        run: |
          # The repository keeps expo-dev-client for development workflows.
          # Remove it only in this temporary CI workspace so the APK opens
          # the Suru Collection app directly instead of the Expo launcher.
          npm uninstall expo-dev-client --package-lock=false
          node -e "const p=require('./package.json'); if (p.dependencies?.['expo-dev-client'] || p.devDependencies?.['expo-dev-client']) process.exit(1)"
          if [ -d node_modules/expo-dev-client ] || [ -d node_modules/expo-dev-launcher ]; then
            echo "Expo development launcher is still installed"
            exit 1
          fi

      - name: Generate app icons preserving original logo artwork
        working-directory: mobile
        shell: bash
        run: |
          python3 -m pip install --disable-pip-version-check --user Pillow
          curl -fsSL "https://raw.githubusercontent.com/surucollection/home/d0f50f6e4e92f6eabd917ff04b0581d035f9fbe9/assets/suru-logo-official.png" -o /tmp/suru-logo-official.png
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path

          # Keep the official image's full canvas and artwork placement; never crop or enlarge it.
          source = Image.open("/tmp/suru-logo-official.png").convert("RGBA")
          # If the source is an opaque image, remove only edge-connected near-white canvas pixels.
          # Enclosed white artwork details stay white; logo pixels are never recoloured.
          if source.getchannel("A").getextrema() == (255, 255):
              width, height = source.size
              pixels = source.load()
              seen = bytearray(width * height)
              stack = []
              def enqueue(x, y):
                  index = y * width + x
                  if not seen[index] and is_canvas_white(x, y):
                      seen[index] = 1
                      stack.append((x, y))
              for x in range(width):
                  enqueue(x, 0)
                  enqueue(x, height - 1)
              for y in range(height):
                  enqueue(0, y)
                  enqueue(width - 1, y)
              while stack:
                  x, y = stack.pop()
                  r, g, b, _ = pixels[x, y]
                  pixels[x, y] = (r, g, b, 0)
                  for ny in range(max(0, y - 1), min(height, y + 2)):
                      for nx in range(max(0, x - 1), min(width, x + 2)):
                          enqueue(nx, ny)
          
          # Resize the full source canvas proportionally. Never crop to the logo bounds.
          source.thumbnail((512, 512), Image.Resampling.LANCZOS)
          canvas = Image.new("RGBA", (512, 512), (0, 0, 0, 0))
          canvas.alpha_composite(source, ((512 - source.width) // 2, (512 - source.height) // 2))
          assets = Path("assets")
          assets.mkdir(exist_ok=True)
          canvas.save(assets / "icon.png", "PNG", optimize=True)
          canvas.save(assets / "adaptive-icon.png", "PNG", optimize=True)
          canvas.save(assets / "play-store-icon-512.png", "PNG", optimize=True)
          ios = Image.new("RGBA", (512, 512), (255, 255, 255, 255))
          ios.alpha_composite(canvas)
          ios.convert("RGB").save(assets / "ios-icon.png", "PNG", optimize=True)
          for name in ("icon.png", "adaptive-icon.png", "play-store-icon-512.png", "ios-icon.png"):
              image = Image.open(assets / name)
              image.load()
              assert image.size == (512, 512), (name, image.size)
          assert Image.open(assets / "icon.png").mode == "RGBA"
          assert Image.open(assets / "adaptive-icon.png").mode == "RGBA"
          assert Image.open(assets / "play-store-icon-512.png").mode == "RGBA"
          assert Image.open(assets / "ios-icon.png").mode == "RGB"
          print("Generated 512x512 icons preserving original logo framing.")
          PY
      - name: Generate Android project
        working-directory: mobile
        run: npx expo prebuild --platform android --no-install

      - name: Build standalone installable debug APK
        working-directory: mobile/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify APK
        run: |
          test -f mobile/android/app/build/outputs/apk/debug/app-debug.apk
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          APKSIGNER="$(find "$SDK_ROOT/build-tools" -type f -name apksigner | sort | tail -n 1)"
          "$APKSIGNER" verify --print-certs mobile/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: Suru-Collection-Android-Debug-APK
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
