name: Suru Collection Android APK

on:
  push:
    branches:
      - feat/native-mobile-app
    paths:
      - 'mobile/**'
      - '.github/workflows/android-debug-apk.yml'
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate Android SDK manager
        id: android-sdk
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager was not found under $SDK_ROOT/cmdline-tools"
            find "$SDK_ROOT" -maxdepth 4 -type f -name sdkmanager -print || true
            exit 1
          fi
          echo "sdkmanager=$SDKMANAGER" >> "$GITHUB_OUTPUT"
          echo "Using $SDKMANAGER"

      - name: Accept Android SDK licences and install required packages
        shell: bash
        run: |
          SDKMANAGER="${{ steps.android-sdk.outputs.sdkmanager }}"
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          set +o pipefail
          yes | "$SDKMANAGER" --licenses
          set -o pipefail
          "$SDKMANAGER" --install "platform-tools" "platforms;android-37.0" "build-tools;37.0.0"
          if [ -d "$SDK_ROOT/platforms/android-37.0" ] && [ ! -e "$SDK_ROOT/platforms/android-37" ]; then
            ln -s android-37.0 "$SDK_ROOT/platforms/android-37"
          fi
          ls -ld "$SDK_ROOT/platforms/android-37" "$SDK_ROOT/platforms/android-37.0"

      - name: Install dependencies
        working-directory: mobile
        run: npm ci

      - name: Remove Expo development launcher for standalone Android app
        working-directory: mobile
        shell: bash
        run: |
          # The repository keeps expo-dev-client for development workflows.
          # Remove it only in this temporary CI workspace so the APK opens
          # the Suru Collection app directly instead of the Expo launcher.
          npm uninstall expo-dev-client --package-lock=false
          node -e "const p=require('./package.json'); if (p.dependencies?.['expo-dev-client'] || p.devDependencies?.['expo-dev-client']) process.exit(1)"
          if [ -d node_modules/expo-dev-client ] || [ -d node_modules/expo-dev-launcher ]; then
            echo "Expo development launcher is still installed"
            exit 1
          fi

      - name: Generate compatible Suru app icons from official logo
        working-directory: mobile
        shell: bash
        run: |
          python3 -m pip install --disable-pip-version-check --user Pillow
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path

          source = Image.open("assets/suru-logo-transparent.png").convert("RGBA")
          # Ignore empty transparent margins when present, but preserve the logo artwork.
          alpha = source.getchannel("A")
          bbox = alpha.getbbox()
          if bbox:
              source = source.crop(bbox)

          assets = Path("assets")
          assets.mkdir(exist_ok=True)

          def contain(canvas_size, max_size, background):
              logo = source.copy()
              logo.thumbnail((max_size, max_size), Image.Resampling.LANCZOS)
              canvas = Image.new("RGBA", (canvas_size, canvas_size), background)
              canvas.alpha_composite(logo, ((canvas_size - logo.width) // 2, (canvas_size - logo.height) // 2))
              return canvas

          transparent = (0, 0, 0, 0)
          white = (255, 255, 255, 255)
          # Main app artwork and Android adaptive foreground keep true transparency.
          contain(512, 460, transparent).save(assets / "icon.png", "PNG", optimize=True)
          contain(512, 400, transparent).save(assets / "adaptive-icon.png", "PNG", optimize=True)
          # iOS and Play listing artwork use a solid white canvas for platform compatibility.
          contain(512, 460, white).convert("RGB").save(assets / "ios-icon.png", "PNG", optimize=True)
          contain(512, 460, white).convert("RGB").save(assets / "play-store-icon-512.png", "PNG", optimize=True)
          for name in ("icon.png", "adaptive-icon.png", "ios-icon.png", "play-store-icon-512.png"):
              image = Image.open(assets / name)
              image.load()
              assert image.size == (512, 512), (name, image.size)
          assert Image.open(assets / "icon.png").mode == "RGBA"
          assert Image.open(assets / "adaptive-icon.png").mode == "RGBA"
          assert Image.open(assets / "ios-icon.png").mode == "RGB"
          assert Image.open(assets / "play-store-icon-512.png").mode == "RGB"
          print("Generated verified 512x512 Suru icons.")
          PY

      - name: Generate Android project
        working-directory: mobile
        run: npx expo prebuild --platform android --no-install

      - name: Build standalone installable debug APK
        working-directory: mobile/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify APK
        run: |
          test -f mobile/android/app/build/outputs/apk/debug/app-debug.apk
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          APKSIGNER="$(find "$SDK_ROOT/build-tools" -type f -name apksigner | sort | tail -n 1)"
          "$APKSIGNER" verify --print-certs mobile/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: Suru-Collection-Android-Debug-APK
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
